name: Build uploaded GLB

on:
  push:
    branches: [main]
    paths:
      - 'model_parts/READY'

permissions:
  contents: write

jobs:
  build-glb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild GLB from uploaded chunks
        shell: bash
        run: |
          set -euo pipefail
          cat model_parts/part-* | base64 --decode > /tmp/porsche-911-user.glb
          test -s /tmp/porsche-911-user.glb
          test "$(head -c 4 /tmp/porsche-911-user.glb)" = "glTF"
          mkdir -p assets porsche-scroll-3d/assets
          cp /tmp/porsche-911-user.glb assets/porsche-911-user.glb
          cp /tmp/porsche-911-user.glb porsche-scroll-3d/assets/porsche-911-user.glb

      - name: Commit generated model
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/porsche-911-user.glb porsche-scroll-3d/assets/porsche-911-user.glb
          if git diff --cached --quiet; then
            echo "Model already up to date."
            exit 0
          fi
          git commit -m "Add uploaded 3D car model"
          git push
